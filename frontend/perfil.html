<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha conta - Domínio Store</title>
    <meta name="description" content="Atualize seus dados pessoais, sua foto de perfil e sua senha na Domínio Store.">
    <link rel="stylesheet" href="estilo-visual/vitrine.css">
    <link rel="stylesheet" href="estilo-visual/painel.css">
</head>
<body>
    <header class="topo">
        <a class="marca" href="index.html">DOMÍNIO STORE</a>
        <nav>
            <a href="index.html">Vitrine</a>
            <a href="dashboard.html" id="link-painel" style="display:none">Painel</a>
        </nav>
        <div class="topo-direita">
            <button class="btn-ghost" id="btn-sair-perfil">Sair</button>
        </div>
    </header>

    <main class="painel-conteudo">
        <h1 class="painel-titulo">Minha conta</h1>
        <p class="painel-subtitulo" id="perfil-resumo"></p>

        <section class="bloco">
            <h2>Dados pessoais</h2>
            <form id="form-perfil">
                <div class="perfil-foto-area">
                    <img id="perfil-foto-previa" alt="Foto de perfil" src="">
                    <div class="campo">
                        <label for="perfil-foto">Foto de perfil</label>
                        <input type="file" id="perfil-foto" accept="image/*">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="campo">
                        <label for="perfil-nome">Nome</label>
                        <input type="text" id="perfil-nome" required>
                    </div>
                    <div class="campo">
                        <label for="perfil-sobrenome">Sobrenome</label>
                        <input type="text" id="perfil-sobrenome">
                    </div>
                    <div class="campo">
                        <label for="perfil-email">E-mail</label>
                        <input type="email" id="perfil-email" disabled>
                    </div>
                    <div class="campo">
                        <label for="perfil-nascimento">Data de nascimento</label>
                        <input type="text" id="perfil-nascimento" placeholder="DD/MM/AAAA">
                    </div>
                    <div class="campo">
                        <label for="perfil-telefone">Telefone</label>
                        <input type="text" id="perfil-telefone" placeholder="(00) 00000-0000">
                    </div>
                    <div class="campo">
                        <label for="perfil-senha">Nova senha (opcional)</label>
                        <input type="password" id="perfil-senha" placeholder="mínimo 6 caracteres">
                    </div>
                    <div class="campo largo">
                        <label for="perfil-endereco">Endereço de entrega</label>
                        <textarea id="perfil-endereco" placeholder="Rua, número, bairro, cidade"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-submit">SALVAR ALTERAÇÕES</button>
                <div id="perfil-aviso" style="display:none"></div>
            </form>
        </section>
    </main>

    <script src="scripts-js/config.js"></script>
    <script src="scripts-js/api-local.js"></script>
    <script src="scripts-js/perfil.js"></script>
</body>
</html>
