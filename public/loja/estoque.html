<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque - Domínio Store</title>
  <meta name="description" content="Página exclusiva do administrador para cadastrar celulares, atualizar preços, estoque e imagens.">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="index.html">DOMÍNIO STORE</a>
    <nav>
      <a href="index.html">Vitrine</a>
      <a href="admin.html">Painel</a>
      <a href="estoque.html">Estoque</a>
      <a href="perfil.html">Minha conta</a>
    </nav>
    <div class="topo-direita">
      <span class="etiqueta" id="nome-admin"></span>
      <button class="btn btn-claro" id="btn-sair">Sair</button>
    </div>
  </header>

  <main class="conteudo">
    <h1>Estoque de celulares</h1>
    <div id="aviso" style="display:none"></div>

    <section class="bloco">
      <h2>Cadastrar celular</h2>
      <form id="form-produto">
        <div class="form-grid">
          <div class="campo"><label for="p-nome">Nome</label><input type="text" id="p-nome" required></div>
          <div class="campo"><label for="p-categoria">Categoria</label><input type="text" id="p-categoria" placeholder="Premium"></div>
          <div class="campo"><label for="p-preco">Preço (R$)</label><input type="number" id="p-preco" step="0.01" min="0.01" required></div>
          <div class="campo"><label for="p-estoque">Estoque</label><input type="number" id="p-estoque" min="0" step="1" required></div>
          <div class="campo"><label for="p-descricao">Descrição</label><input type="text" id="p-descricao"></div>
          <div class="campo"><label for="p-imagem">Imagem do celular</label><input type="file" id="p-imagem" accept="image/*"></div>
        </div>
        <button type="submit" class="btn">SALVAR CELULAR</button>
      </form>
    </section>

    <section class="bloco">
      <h2>Celulares cadastrados</h2>
      <p class="etiqueta">Altere preço, estoque, imagem e disponibilidade direto na tabela.</p>
      <table>
        <thead><tr><th>Imagem</th><th>Nome</th><th>Preço</th><th>Estoque</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody id="tabela-produtos"></tbody>
      </table>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api-local.js"></script>
  <script src="js/services.js"></script>
  <script src="js/estoque.js"></script>
</body>
</html>
