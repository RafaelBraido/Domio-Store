<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - Domínio Store</title>
  <meta name="description" content="Acesse sua conta da Domínio Store para comprar celulares e acompanhar seus pedidos.">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="caixa-form">
    <h2>ENTRAR NA DOMÍNIO STORE</h2>
    <div id="aviso" style="display:none"></div>
    <form id="form-login">
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" required>
      </div>
      <button type="submit" class="btn btn-bloco">ENTRAR</button>
    </form>
    <p class="link-abaixo">Não tem conta? <a href="cadastro.html">Criar conta</a></p>
    <p class="link-abaixo">Sua conta fica salva neste aparelho: ao entrar uma vez, você não precisa logar de novo.</p>
    <p class="link-abaixo"><a href="index.html">Voltar para a vitrine</a></p>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api-local.js"></script>
  <script src="js/services.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
