<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta - Domínio Store</title>
  <meta name="description" content="Crie sua conta gratuita na Domínio Store e compre smartphones com pagamento via Pix.">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div class="caixa-form">
    <h2>SUA CONTA DA DOMÍNIO STORE</h2>
    <div id="aviso" style="display:none"></div>
    <form id="form-cadastro">
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" required>
      </div>
      <div class="campo">
        <label for="sobrenome">Sobrenome</label>
        <input type="text" id="sobrenome">
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>
      </div>
      <div class="campo">
        <label for="nascimento">Data de nascimento</label>
        <input type="text" id="nascimento" placeholder="DD/MM/AAAA">
      </div>
      <div class="campo">
        <label for="senha">Senha (mínimo 6 caracteres)</label>
        <input type="password" id="senha" minlength="6" required>
      </div>
      <div class="campo">
        <label for="confirmar">Confirmar senha</label>
        <input type="password" id="confirmar" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-bloco">CRIAR CONTA</button>
    </form>
    <p class="link-abaixo">Já tem conta? <a href="login.html">Entrar</a></p>
    <p class="link-abaixo"><a href="index.html">Voltar para a vitrine</a></p>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api-local.js"></script>
  <script src="js/services.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
